# Baseline config. Profile files (standalone / clustered) override the
# pieces that actually differ between deployment modes.
server:
  port: 8100
  compression:
    enabled: true

spring:
  application:
    name: hitorro-fleet-mail-analytics
  profiles:
    default: standalone
  # Spring Boot 4 defaults to Jackson 3 (tools.jackson). The service and the
  # HiTorro libraries use Jackson 2 JsonNode, so HTTP stays on Jackson 2:
  # converters for Spring MVC, codecs for WebFlux (the WebClients built with
  # WebClient.builder() register theirs in Jackson2Codecs).
  http:
    converters:
      preferred-json-mapper: jackson2
    codecs:
      preferred-json-mapper: jackson2
  # spring.jackson2.* configures the Jackson 2 ObjectMapper that Spring MVC
  # uses (spring.jackson.* only reaches the Jackson 3 one, which already
  # writes dates as ISO-8601 strings by default).
  jackson2:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate does not validate — `validate`
      # is too strict about @Lob/TEXT/CLOB round-trips on H2 in Postgres mode.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.hitorro.fleet.mailanalytics: INFO

mailanalytics:
  mode: standalone
  retrieval:
    base-url: http://localhost:8095
    timeout-ms: 15000
    default-index: mail
  pipelines:
    home: ${user.home}/hthome/pipelines
    hot-dir: ${user.home}/hthome/mailanalytics/hot
    ingest-job-yaml: classpath:jobs/mail-enrich-from-ndjson.yaml
  ingest:
    default-cron: "0 */5 * * * *"
    batch-size: 500
    backfill-horizon: 365d
    sources: []
  delivery:
    email:
      enabled: false
      host: localhost
      port: 25
      from: mail-analytics@localhost
    webhook:
      timeout-ms: 10000
      max-retries: 3
  cors:
    allowed-origins: "*"
