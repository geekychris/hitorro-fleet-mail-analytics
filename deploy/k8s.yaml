# Minimal K8s manifest. Adjust namespace, image, secrets to your env.
apiVersion: v1
kind: ConfigMap
metadata: { name: mail-analytics-config }
data:
  MAILANALYTICS_DB_URL: "jdbc:postgresql://postgres:5432/mailanalytics"
  MAILANALYTICS_SMTP_HOST: "smtp.internal"
  MAILANALYTICS_SMTP_PORT: "587"
  MAILANALYTICS_SMTP_FROM: "mail-analytics@hitorro"
  MAILANALYTICS_IMAP_HOST: "imap.example.com"
  MAILANALYTICS_IMAP_USER: "you@example.com"
  SPRING_PROFILES_ACTIVE: "clustered"
---
apiVersion: v1
kind: Secret
metadata: { name: mail-analytics-secrets }
type: Opaque
stringData:
  MAILANALYTICS_DB_PASSWORD: "change-me"
  MAILANALYTICS_SMTP_PASSWORD: "change-me"
  MAILANALYTICS_IMAP_PASSWORD: "change-me"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mail-analytics }
spec:
  replicas: 1
  selector: { matchLabels: { app: mail-analytics } }
  template:
    metadata: { labels: { app: mail-analytics } }
    spec:
      containers:
        - name: app
          image: hitorro/mail-analytics:3.0.1
          ports: [{ containerPort: 8100 }]
          envFrom:
            - configMapRef: { name: mail-analytics-config }
            - secretRef: { name: mail-analytics-secrets }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8100 }, initialDelaySeconds: 20 }
          livenessProbe:  { httpGet: { path: /actuator/health, port: 8100 }, initialDelaySeconds: 60 }
---
apiVersion: v1
kind: Service
metadata: { name: mail-analytics }
spec:
  selector: { app: mail-analytics }
  ports: [{ port: 80, targetPort: 8100 }]
